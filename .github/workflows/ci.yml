name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 语法检查
        run: |
          node --check index.js
          node --check client.js
          for f in core/*.js roles/*.js scripts/*.mjs test/harness.mjs; do node --check "$f"; done
      - name: 自测（204 项）
        run: node test/harness.mjs
      - name: 发布自检
        run: node scripts/check-release.mjs
      - name: 依赖体检
        run: node scripts/check-imports.mjs
